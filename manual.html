<!doctype html>
<html lang="zh-CN">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>操作说明书 · 研发OA综合平台</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* ---------- 预览页专属样式 ---------- */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #f5f7fa;
        color: #333;
        min-height: 100vh;
      }

      /* 顶部导航 */
      .manual-header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: #fff;
        border-bottom: 1px solid #e8e8e8;
        box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      }
      .manual-header-inner {
        max-width: 1100px;
        margin: 0 auto;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .manual-header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .manual-logo {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #1890ff, #096dd9);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 700;
        font-size: 16px;
      }
      .manual-title {
        font-size: 16px;
        font-weight: 600;
        color: #1a1a1a;
      }
      .manual-subtitle {
        font-size: 12px;
        color: #999;
        margin-top: 2px;
      }
      .manual-header-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .manual-btn {
        padding: 6px 14px;
        border: 1px solid #d9d9d9;
        background: #fff;
        border-radius: 4px;
        font-size: 13px;
        color: #555;
        cursor: pointer;
        transition: all 0.2s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .manual-btn:hover {
        border-color: #1890ff;
        color: #1890ff;
      }
      .manual-btn.primary {
        background: #1890ff;
        border-color: #1890ff;
        color: #fff;
      }
      .manual-btn.primary:hover {
        background: #096dd9;
      }

      /* 主体布局 */
      .manual-body {
        max-width: 1100px;
        margin: 20px auto;
        padding: 0 24px;
        display: flex;
        gap: 20px;
        min-height: calc(100vh - 80px);
      }

      /* 侧边目录 */
      .manual-toc {
        flex-shrink: 0;
        width: 220px;
        position: sticky;
        top: 80px;
        height: fit-content;
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #e8e8e8;
        padding: 16px 14px;
      }
      .manual-toc-title {
        font-size: 13px;
        font-weight: 600;
        color: #999;
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid #f0f0f0;
      }
      .manual-toc-list {
        list-style: none;
      }
      .manual-toc-list li {
        margin: 0;
      }
      .manual-toc-list a {
        display: block;
        padding: 4px 8px;
        font-size: 13px;
        color: #555;
        text-decoration: none;
        border-radius: 3px;
        line-height: 1.6;
        transition: all 0.15s;
      }
      .manual-toc-list a:hover {
        background: #e6f7ff;
        color: #1890ff;
      }
      .manual-toc-list a.active {
        background: #1890ff;
        color: #fff;
      }
      .manual-toc-list .toc-h2 {
        padding-left: 8px;
        font-weight: 500;
      }
      .manual-toc-list .toc-h3 {
        padding-left: 20px;
        font-size: 12px;
      }

      /* 预览内容 */
      .manual-content-wrap {
        flex: 1;
        min-width: 0;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #e8e8e8;
        padding: 36px 44px;
      }

      /* 加载/错误状态 */
      .manual-loading,
      .manual-error {
        text-align: center;
        padding: 60px 20px;
        color: #999;
      }
      .manual-loading .spinner {
        display: inline-block;
        width: 32px;
        height: 32px;
        border: 3px solid #e8e8e8;
        border-top-color: #1890ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .manual-error {
        color: #cf1322;
      }
      .manual-error h3 {
        font-size: 16px;
        margin-bottom: 10px;
        color: #cf1322;
      }
      .manual-error p {
        font-size: 13px;
        line-height: 1.8;
        margin-bottom: 6px;
      }
      .manual-error code {
        background: #f5f5f5;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: Consolas, Monaco, monospace;
        font-size: 12px;
      }

      /* Markdown 预览样式增强 */
      .md-preview {
        line-height: 1.8;
        color: #333;
        font-size: 14px;
      }
      .md-preview h1 {
        font-size: 26px;
        border-bottom: 2px solid #1890ff;
        padding-bottom: 12px;
        margin: 32px 0 20px;
        color: #1a1a1a;
      }
      .md-preview h2 {
        font-size: 20px;
        border-bottom: 1px solid #e8e8e8;
        padding-bottom: 8px;
        margin: 28px 0 16px;
        color: #1f1f1f;
      }
      .md-preview h3 {
        font-size: 16px;
        margin: 22px 0 12px;
        color: #262626;
      }
      .md-preview h4 {
        font-size: 14px;
        margin: 16px 0 10px;
        color: #333;
      }
      .md-preview h5,
      .md-preview h6 {
        font-size: 13px;
        margin: 14px 0 8px;
        color: #555;
      }
      .md-preview p {
        margin: 10px 0;
        line-height: 1.85;
      }
      .md-preview ul,
      .md-preview ol {
        margin: 10px 0;
        padding-left: 24px;
      }
      .md-preview li {
        margin: 4px 0;
        line-height: 1.75;
      }
      .md-preview code {
        background: #f5f5f5;
        padding: 2px 7px;
        border-radius: 3px;
        font-family: Consolas, Monaco, monospace;
        font-size: 13px;
        color: #d6336c;
      }
      .md-preview pre {
        background: #1f2430;
        color: #e6edf3;
        padding: 16px 20px;
        border-radius: 6px;
        overflow-x: auto;
        margin: 14px 0;
        font-size: 13px;
      }
      .md-preview pre code {
        background: none;
        color: inherit;
        padding: 0;
        font-size: 13px;
      }
      .md-preview strong {
        color: #1a1a1a;
        font-weight: 600;
      }
      .md-preview em {
        color: #555;
      }
      .md-preview table {
        border-collapse: collapse;
        width: 100%;
        margin: 16px 0;
        font-size: 13px;
        display: block;
        overflow-x: auto;
      }
      .md-preview th {
        background: #fafafa;
        border: 1px solid #e8e8e8;
        padding: 9px 14px;
        text-align: left;
        font-weight: 600;
      }
      .md-preview td {
        border: 1px solid #e8e8e8;
        padding: 8px 14px;
      }
      .md-preview tr:nth-child(even) td {
        background: #fafbfc;
      }
      .md-preview .check-on { color: #389e0d; list-style: none; }
      .md-preview .check-off { color: #bbb; list-style: none; }

      /* 响应式：窄屏隐藏目录 */
      @media (max-width: 900px) {
        .manual-toc { display: none; }
        .manual-body { padding: 0 12px; }
        .manual-content-wrap { padding: 20px 18px; }
      }
    </style>
  </head>
  <body>
    <!-- 顶部导航 -->
    <header class="manual-header">
      <div class="manual-header-inner">
        <div class="manual-header-left">
          <div class="manual-logo">前</div>
          <div>
            <div class="manual-title">研发OA综合平台 · 操作说明书</div>
            <div class="manual-subtitle">前卫表业 · 产品原型文档</div>
          </div>
        </div>
        <div class="manual-header-right">
          <a href="index.html" class="manual-btn">← 返回登录页</a>
          <button class="manual-btn" onclick="refreshManual()">🔄 重新加载</button>
          <button class="manual-btn primary" onclick="downloadManual()">⬇ 下载原始 MD</button>
        </div>
      </div>
    </header>

    <!-- 主体 -->
    <div class="manual-body">
      <!-- 侧边目录 -->
      <nav class="manual-toc" id="manualToc" style="display: none">
        <div class="manual-toc-title">📑 目录</div>
        <ul class="manual-toc-list" id="manualTocList"></ul>
      </nav>

      <!-- 预览内容 -->
      <main class="manual-content-wrap" id="manualContent">
        <div class="manual-loading">
          <div class="spinner"></div>
          <p>正在加载操作说明书...</p>
        </div>
      </main>
    </div>

    <script>
      /* ---------- 简易 HTML 转义 ---------- */
      function _escape(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      /* ---------- 简易 Markdown → HTML（复用项目 _renderMd 逻辑） ---------- */
      function _renderMd(text) {
        if (!text) return "";
        let s = String(text).replace(/\r\n/g, "\n").replace(/\r/g, "\n");

        // 代码块占位
        const codeBlocks = [];
        s = s.replace(/^```(\w*)\n([\s\S]*?)```\s*$/gm, (match, lang, code) => {
          const idx = codeBlocks.length;
          codeBlocks.push(
            `<pre><code data-lang="${_escape(lang)}">${_escape(code.trim()).replace(/\n/g, "&#10;")}</code></pre>`
          );
          return `__CODE_BLOCK_${idx}__`;
        });
        s = _escape(s);
        s = s.replace(/__CODE_BLOCK_(\d+)__/g, (_, idx) => codeBlocks[+idx]);

        // 行内代码
        s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
        // 粗体
        s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        // 斜体
        s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        // 链接 [text](url)
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

        // H1-H6
        s = s.replace(/^######\s+(.+)$/gm, '<h6 id="$1">$1</h6>');
        s = s.replace(/^#####\s+(.+)$/gm, '<h5 id="$1">$1</h5>');
        s = s.replace(/^####\s+(.+)$/gm, '<h4 id="$1">$1</h4>');
        s = s.replace(/^###\s+(.+)$/gm, '<h3 id="$1">$1</h3>');
        s = s.replace(/^##\s+(.+)$/gm, '<h2 id="$1">$1</h2>');
        s = s.replace(/^#\s+(.+)$/gm, '<h1 id="$1">$1</h1>');

        // 勾选框
        s = s.replace(/^([ \t]*)- \[ \]\s+(.+)$/gm, "$1<li class='md-ul check-off'>☐ $2</li>");
        s = s.replace(/^([ \t]*)- \[[xX]\]\s+(.+)$/gm, "$1<li class='md-ul check-on'>☑ $2</li>");
        // 无序列表
        s = s.replace(/^([ \t]*)[-*]\s+(.+)$/gm, "$1<li class='md-ul'>$2</li>");
        // 有序列表
        s = s.replace(/^([ \t]*)\d+\.\s+(.+)$/gm, "$1<li class='md-ol'>$2</li>");

        // 包裹 li 成 ul/ol
        const listLines = s.split("\n");
        let listOut = [];
        let ulBuf = [], olBuf = [];
        const flushUl = () => {
          if (ulBuf.length) { listOut.push("<ul>" + ulBuf.join("") + "</ul>"); ulBuf = []; }
        };
        const flushOl = () => {
          if (olBuf.length) { listOut.push("<ol>" + olBuf.join("") + "</ol>"); olBuf = []; }
        };
        for (let i = 0; i < listLines.length; i++) {
          const line = listLines[i];
          if (/^<li class='md-ul/.test(line)) { flushOl(); ulBuf.push(line); }
          else if (/^<li class='md-ol/.test(line)) { flushUl(); olBuf.push(line); }
          else { flushUl(); flushOl(); listOut.push(line); }
        }
        flushUl(); flushOl();
        s = listOut.join("\n");

        // 表格
        const tLines = s.split("\n");
        let tOut = [], inTable = false;
        for (let i = 0; i < tLines.length; i++) {
          const line = tLines[i];
          if (/^\|.*\|$/.test(line)) {
            if (!inTable) { tOut.push("<table>"); inTable = true; }
            const cells = line.replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
            if (i + 1 < tLines.length && /^\|[\s:|-]+\|$/.test(tLines[i + 1])) {
              tOut.push("<thead><tr>" + cells.map((c) => `<th>${c}</th>`).join("") + "</tr></thead><tbody>");
              i++;
            } else {
              tOut.push("<tr>" + cells.map((c) => `<td>${c}</td>`).join("") + "</tr>");
            }
          } else {
            if (inTable) { tOut.push("</tbody></table>"); inTable = false; }
            tOut.push(line);
          }
        }
        if (inTable) tOut.push("</tbody></table>");
        s = tOut.join("\n");

        // 段落包裹
        s = s.replace(/^(?!<[a-z]|<li|<pre|<table|<ul|<ol|<h|<\/|<hr)(.+)$/gm, "<p>$1</p>");
        // 分割线 ---
        s = s.replace(/^\s*---\s*$/gm, "<hr />");
        // 清理多余空行
        s = s.replace(/\n{2,}/g, "\n");

        return `<div class="md-preview">${s}</div>`;
      }

      /* ---------- 过滤 README 开头手写的目录章节 ---------- */
      function _stripHandwrittenToc(mdText) {
        const lines = mdText.replace(/\r\n/g, "\n").split("\n");
        // 匹配：## 目录 或 ## 目录/Contents/Table of Contents 等
        const tocHeadRe = /^##\s+([\u4e00-\u9fa5]*目录[\u4e00-\u9fa5]*|Contents|Table of Contents)\s*$/i;
        let tocStart = -1;
        for (let i = 0; i < lines.length; i++) {
          if (tocHeadRe.test(lines[i].trim())) { tocStart = i; break; }
        }
        if (tocStart === -1) return mdText;
        // 从 tocStart+1 开始，找到下一个真正的 ## 标题（不是缩进的子项）
        let tocEnd = -1;
        for (let j = tocStart + 1; j < lines.length; j++) {
          const t = lines[j].trim();
          if (/^##\s+\S/.test(t)) { tocEnd = j; break; }
        }
        if (tocEnd === -1) return mdText;
        return lines.slice(0, tocStart).concat(lines.slice(tocEnd)).join("\n").replace(/\n{3,}/g, "\n\n");
      }

      /* ---------- 从 Markdown 提取 H2/H3 作为目录 ---------- */
      function buildToc(mdText) {
        const lines = mdText.split("\n");
        const items = [];
        for (const line of lines) {
          const m = line.match(/^(#{2,3})\s+(.+)$/);
          if (m) {
            const text = m[2].trim();
            // 跳过标题就是"目录"本身的项（双重保险）
            if (/^(目录|Contents|Table of Contents)$/i.test(text)) continue;
            items.push({ level: m[1].length, text });
          }
        }
        return items;
      }

      /* ---------- 给渲染后的标题打稳定 slug id，并同步到 toc ---------- */
      function assignSectionIds(contentEl, tocItems) {
        const headers = contentEl.querySelectorAll("h2, h3");
        const validHeaders = [];
        let idx = 0;
        headers.forEach((h) => {
          const text = h.textContent.trim();
          // 跳过被过滤的目录标题（双重保险）
          if (/^(目录|Contents|Table of Contents)$/i.test(text)) return;
          const slug = "sec-" + idx++;
          h.id = slug;
          validHeaders.push({ slug, el: h, level: h.tagName === "H2" ? 2 : 3, text });
        });
        // 把 slug 合并进 tocItems
        validHeaders.forEach((vh, i) => {
          if (tocItems[i]) tocItems[i].slug = vh.slug;
        });
        return validHeaders;
      }

      /* ---------- 加载 README.md ---------- */
      async function loadManual() {
        const content = document.getElementById("manualContent");
        const tocNav = document.getElementById("manualToc");
        const tocList = document.getElementById("manualTocList");

        content.innerHTML = '<div class="manual-loading"><div class="spinner"></div><p>正在加载操作说明书...</p></div>';
        tocNav.style.display = "none";

        let mdText = null;

        // 方式一：fetch（HTTP 协议下有效）
        try {
          const res = await fetch("./README.md", { cache: "no-cache" });
          if (res.ok) mdText = await res.text();
        } catch (e) {
          // fetch 失败（file:// 协议），继续尝试方式二
        }

        // 方式二：XMLHttpRequest 同步（file:// 协议下部分浏览器可用）
        if (!mdText) {
          try {
            const xhr = new XMLHttpRequest();
            xhr.open("GET", "./README.md", false);
            xhr.send(null);
            if (xhr.status === 200 || (xhr.status === 0 && xhr.responseText)) {
              mdText = xhr.responseText;
            }
          } catch (e) {}
        }

        // 方式三：localStorage 兜底（如果用户之前用过应用，可能有缓存）
        if (!mdText) {
          mdText = localStorage.getItem("oa_manual_cache");
        }

        // 全部失败 → 显示错误提示
        if (!mdText) {
          content.innerHTML = `
            <div class="manual-error">
              <h3>⚠️ 无法读取 README.md</h3>
              <p>直接双击 <code>index.html</code> 使用的是 <code>file://</code> 协议，</p>
              <p>浏览器出于安全考虑禁止页面读取同目录下的其他文件。</p>
              <p style="margin-top: 16px; color: #555;">✅ 请通过以下方式启动本地服务器后再访问：</p>
              <p><code>cd rd-oa-platform &amp;&amp; npx serve -p 3000</code></p>
              <p>然后浏览器打开 <code>http://localhost:3000/manual.html</code></p>
              <p style="margin-top: 12px; color: #555;">或使用 VS Code 的 <strong>Live Server</strong> 插件。</p>
            </div>`;
          return;
        }

        // 缓存到 localStorage，后续直接双击也能看
        try { localStorage.setItem("oa_manual_cache", mdText); } catch (e) {}

        // 过滤手写目录章节（README 开头的 ## 目录 + 链接列表），避免重复渲染
        mdText = _stripHandwrittenToc(mdText);

        // 渲染正文
        content.innerHTML = _renderMd(mdText);

        // 渲染侧边目录
        const toc = buildToc(mdText);
        if (toc.length > 0) {
          // 先给标题打 slug id，再同步到 toc
          const headers = assignSectionIds(content, toc);

          tocList.innerHTML = toc.map((item) => {
            const cls = item.level === 2 ? "toc-h2" : "toc-h3";
            return `<li><a href="#${item.slug || ''}" class="${cls}" data-slug="${item.slug}">${item.text}</a></li>`;
          }).join("");
          tocNav.style.display = "block";

          // 点击目录：阻止默认跳转，手动平滑滚动 + 高亮
          tocList.addEventListener("click", (e) => {
            const link = e.target.closest("a");
            if (!link) return;
            e.preventDefault();
            const slug = link.getAttribute("data-slug");
            const target = document.getElementById(slug);
            if (!target) return;
            // 手动高亮（临时关闭 scroll spy 干扰）
            tocList.querySelectorAll("a").forEach((a) => a.classList.remove("active"));
            link.classList.add("active");
            // 平滑滚动到目标（留 70px 给顶部 header）
            const top = target.getBoundingClientRect().top + window.scrollY - 70;
            window.scrollTo({ top, behavior: "smooth" });
          });

          // 滚动时自动高亮当前章节（节流 + 手动判定顶部最近的标题）
          setupScrollSpy(headers, tocList);
        }
      }

      /* ---------- 滚动监听：节流 + 顶部最近标题判定 ---------- */
      function setupScrollSpy(headers, tocList) {
        let ticking = false;
        function onScroll() {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            ticking = false;
            // 找到距离视口顶部 80px 以下最近的那个标题
            const scrollY = window.scrollY;
            const offset = 80;
            let currentSlug = headers[0] ? headers[0].slug : null;
            for (const h of headers) {
              const top = h.el.getBoundingClientRect().top + scrollY;
              if (top - offset <= scrollY) {
                currentSlug = h.slug;
              } else {
                break;
              }
            }
            // 高亮对应的目录项
            if (currentSlug) {
              tocList.querySelectorAll("a").forEach((a) => {
                a.classList.toggle("active", a.getAttribute("data-slug") === currentSlug);
              });
            }
          });
        }
        window.addEventListener("scroll", onScroll, { passive: true });
        // 首次立即执行一次
        onScroll();
      }

      /* ---------- 重新加载 ---------- */
      function refreshManual() {
        try { localStorage.removeItem("oa_manual_cache"); } catch (e) {}
        loadManual();
      }

      /* ---------- 下载原始 MD ---------- */
      async function downloadManual() {
        let mdText = null;
        try {
          const res = await fetch("./README.md", { cache: "no-cache" });
          if (res.ok) mdText = await res.text();
        } catch (e) {}
        if (!mdText) mdText = localStorage.getItem("oa_manual_cache");
        if (!mdText) {
          alert("无法获取 README.md 内容，请先通过本地服务器打开预览页面");
          return;
        }
        const blob = new Blob([mdText], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "README.md";
        a.click();
        URL.revokeObjectURL(url);
      }

      // 页面加载完成后自动启动
      document.addEventListener("DOMContentLoaded", loadManual);
    </script>
  </body>
</html>
