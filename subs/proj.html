  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>项目管理 · 研发 OA 平台</title>
    <link rel="stylesheet" href="../css/style.css" />
    <!-- 子系统独立样式（在整站样式之后覆写主题变量与局部组件） -->
    <link rel="stylesheet" href="../css/subs/proj.css" />
  </head>
  <body>
    <!-- 启动预判：先于外部 JS 执行，避免刷新时门控闪烁 -->
    <script>
      (function () {
        try {
          var raw = sessionStorage.getItem("oa_session");
          if (raw && JSON.parse(raw)) {
            document.getElementById("sub-gate").style.display = "none";
            document.getElementById("app").style.display = "flex";
          }
        } catch (e) {}
      })();
    </script>

    <!-- ============ 门控：未登录 / 无权限（内容由 subsystem-boot.js 渲染） ============ -->
    <div id="sub-gate" style="display: none">
      <div class="sub-gate-box" id="subGateBox"></div>
    </div>

    <!-- ============ 应用（子系统壳） ============ -->
    <div id="app" style="display: none">

              fill="#ffffff"
            ></path>
          </svg>
          <span id="subLogoName">项目管理</span>
        </div>
        <div class="h-right">
          <div class="top-clock" id="topClock">--:--:--</div>
          <div
            class="bell"
            title="待办提醒"
            onclick="window.showLoginTodoModal && window.showLoginTodoModal(true)"
          >
            🔔<span class="num" style="display:none">0</span>
          </div>
          <div class="avatar-wrap" onclick="toggleAvatar(event)">
            <div class="avatar" id="avatarBox">张</div>
          </div>
          <div class="avatar-menu" id="avatarMenu" style="display: none">
            <div class="am-name" id="amName">张工 (8001)</div>
            <div class="am-role" id="amRole">角色：一般人员</div>
            <div class="am-div"></div>
            <div class="am-item" onclick="logout()">切换角色 / 退出登录</div>
          </div>
        </div>
      </div>
      <div class="body">
        <div class="main">
          <div class="crumb" id="crumb"></div>
          <div class="content" id="content"></div>
        </div>
      </div>

    <div class="modal-mask" id="mask"><div class="modal" id="modal"></div></div>
