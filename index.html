<!doctype html>
<html lang="zh-CN">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>研发OA综合平台 · 产品原型</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- 启动预判：先于外部 JS 执行，避免刷新时登录页闪烁 -->
    <script>
      (function () {
        try {
          var raw = sessionStorage.getItem("oa_session");
          if (raw && JSON.parse(raw)) {
            document.getElementById("view-login").style.display = "none";
            document.getElementById("app").style.display = "flex";
          }
        } catch (e) {}
      })();
    </script>

    <!-- ============ 登录 ============ -->
    <div id="view-login" style="display: none">
      <div class="lg-brand">前卫表业</div>
      <div class="lg-wm" id="lgWm"></div>
      <div class="lg-main">
        <h1>研发OA综合平台</h1>
        <div class="en">R&amp;D OA Integrated Platform</div>
        <div class="login-box">
          <div class="login-tip" id="loginTip">
            请先登录后才能访问本系统（未登录已拦截子系统访问）
          </div>
          <label class="req">用户名 Account</label>
          <input id="lgUser" value="" placeholder="请输入工号 / 账号" />
          <label class="req">密码 Password</label>
          <input id="lgPwd" type="password" value="" placeholder="请输入密码" />
          <button class="lg-btn" onclick="doLogin()">登 录</button>
          <div class="lg-warm">
            温馨提示：如密码遗失，请联系工程技术研究中心！
          </div>
          <div class="lg-demo">
            演示账号（点击自动填充账号与密码，角色由工号自动识别）：
            <div id="lgDemoList" class="lg-demo-list"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ 应用 ============ -->
    <div id="app" style="display: none">
      <div class="header">
        <div class="logo" onclick="selectModule('home')">
          <svg
            class="logo-icon"
            viewBox="0 0 1024 1024"
            xmlns="http://www.w3.org/2000/svg"
          >

              fill="#ffffff"
            ></path>
          </svg>
          研发OA综合平台
        </div>
        <div class="topmenu" id="topmenu"></div>
        <div class="h-right">
          <div class="top-clock" id="topClock">--:--:--</div>
          <div
            class="bell"
            title="待办提醒"
            onclick="window.showLoginTodoModal && window.showLoginTodoModal(true)"
          >
            🔔<span class="num" style="display:none">0</span>
          </div>
          <div class="avatar-wrap" onclick="toggleAvatar(event)">
            <div class="avatar" id="avatarBox">张</div>
          </div>
          <div class="avatar-menu" id="avatarMenu" style="display: none">
            <div class="am-name" id="amName">张工 (8001)</div>
            <div class="am-role" id="amRole">角色：一般人员</div>
            <div class="am-div"></div>
            <div class="am-item" onclick="logout()">切换角色 / 退出登录</div>
          </div>
        </div>
      </div>
      <div class="body">
        <div class="sidebar" id="sidebar">
          <div class="side-head">
            <span class="side-title" id="sideTitle">研发公共</span>
            <button
              class="collapse-btn"
              onclick="toggleSide()"
              title="收起/展开"
            >
              ≡
            </button>
          </div>
          <div class="side-nav" id="sideNav"></div>
        </div>
        <div class="main">
          <div class="crumb" id="crumb"></div>
          <div class="content" id="content"></div>
        </div>
      </div>
    </div>

    <div class="modal-mask" id="mask"><div class="modal" id="modal"></div></div>
    <div class="toast" id="toast"></div>

    <script src="js/modules/strings.js"></script>
    <script src="js/modules/helpers.js"></script>
    <script src="js/modules/ui.js"></script>

    <!-- SheetJS：用于 Excel 导入解析 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- 数据层：基座 + 业务模块（必须在 auth.js 之前，因为 auth.js 依赖 ROLES/MENUS/ALL_ACTIONS 等常量） -->
    <script src="js/modules/config.js"></script>
    <script src="js/modules/config-assets.js"></script>
    <script src="js/modules/config-pa.js"></script>
    <script src="js/modules/config-std.js"></script>
    <script src="js/modules/config-ec.js"></script>

    <script src="js/modules/auth.js"></script>
    <script src="js/modules/router.js"></script>

    <!-- 视图层：业务模块先注册，基座最后填充 VIEWS.home 和通用工具 -->
    <script src="js/modules/views-std.js"></script>
    <script src="js/modules/views-ec.js"></script>
    <script src="js/modules/views-pa.js"></script>
    <script src="js/modules/views-sys.js"></script>
    <script src="js/modules/views-assets.js"></script>
    <script src="js/modules/views.js"></script>

    <script src="js/app.js"></script>
  </body>
</html>
